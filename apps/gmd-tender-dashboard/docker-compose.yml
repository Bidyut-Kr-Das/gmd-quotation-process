services:
  gmd-tender-dashboard:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ghcr.io/laser-power-infra/gmd-tender-dashboard:${APP_VERSION:-latest}
    # ghcr.io/laser-power-infra/laser-tender:${APP_VERSION:-latest}
    container_name: gmd-tender-dashboard
    ports:
      - "4126:4126"

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 4126
      HOSTNAME: 0.0.0.0
      
      # Paths inside the container
      CONDUTOR_PATH: /mnt/condutor/Tenders-bd/Condutor
      INDEXER_NETWORK_PATH: /mnt/indexer/COSTING & INVOLVEMENT
      SUPPLY_NETWORK_PATH: /mnt/supply
      COSTING_FILE_NETWORK_HOST_PATH: /mnt/costing/COSTING & INVOLVEMENT
      OLD_RA_EXCEL_PATH: /mnt/old-files/TENDER 2023-2024
      OLD_FILES: /mnt/old-files/TENDER 2023-2024
      TYPE_TEST_FILES_PATH: /mnt/condutor/Updated TTR

    volumes:
      - condutor:/mnt/condutor
      - indexer:/mnt/indexer
      - supply:/mnt/supply
      - costing:/mnt/costing
      - old-files:/mnt/old-files
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:rw

    restart: unless-stopped

    networks:
      - infra

